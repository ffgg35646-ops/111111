name: Platform quality checks

on:
  push:
    branches:
      - main
      - feature/multiuser-supervision-competency-reports
      - feature/immersive-vr-case-assessment
      - feature/immersive-vr-live-avatar
      - feature/vr-live-avatar-main-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
